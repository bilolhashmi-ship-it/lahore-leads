<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marbiwaz — Lead CRM</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap');

:root {
  --bg: #f5f2ed;
  --surface: #ffffff;
  --dark: #141414;
  --accent: #e8400c;
  --accent2: #2d6a4f;
  --border: #e0dbd3;
  --muted: #9a9289;
  --text: #1a1a1a;
  --tag-bg: #eee9e2;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
}

/* HEADER */
.header {
  background: var(--dark);
  padding: 18px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}

.logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 26px;
  color: #fff;
  letter-spacing: 2px;
}

.logo span { color: var(--accent); }

.header-stats {
  display: flex;
  gap: 24px;
}

.hstat {
  text-align: center;
}

.hstat-num {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  color: #fff;
  line-height: 1;
}

.hstat-label {
  font-size: 9px;
  color: #666;
  text-transform: uppercase;
  letter-spacing: 1px;
}

/* TABS */
.tabs {
  display: flex;
  border-bottom: 2px solid var(--border);
  background: var(--surface);
  padding: 0 28px;
}

.tab {
  padding: 14px 20px;
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  transition: all 0.15s;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

/* PANELS */
.panel { display: none; padding: 28px; }
.panel.active { display: block; }

/* LEADS PANEL */
.filters {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 24px;
  align-items: center;
}

.filter-btn {
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  font-weight: 500;
  padding: 8px 16px;
  border-radius: 20px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.filter-btn:hover, .filter-btn.active {
  background: var(--dark);
  color: #fff;
  border-color: var(--dark);
}

.filter-btn.accent-btn {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}

.leads-list { display: grid; gap: 14px; }

.lead-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 20px 22px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 16px;
  align-items: start;
  transition: box-shadow 0.2s, border-color 0.2s;
  animation: slideUp 0.35s ease both;
}

.lead-card:hover {
  box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  border-color: #ccc;
}

@keyframes slideUp {
  from { opacity:0; transform:translateY(12px); }
  to { opacity:1; transform:translateY(0); }
}

.lead-top {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  margin-bottom: 10px;
}

.lead-icon {
  width: 42px;
  height: 42px;
  border-radius: 8px;
  background: var(--tag-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}

.lead-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 20px;
  letter-spacing: 0.5px;
  color: var(--dark);
  line-height: 1.1;
}

.lead-sub {
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin-top: 2px;
}

.lead-pain {
  font-size: 13px;
  color: #555;
  line-height: 1.55;
  margin-bottom: 12px;
  border-left: 3px solid var(--accent);
  padding-left: 12px;
}

.tags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}

.tag {
  font-size: 10px;
  padding: 3px 10px;
  border-radius: 20px;
  background: var(--tag-bg);
  color: #666;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-weight: 500;
}

.tag.service { background: #e8f4f0; color: var(--accent2); }
.tag.budget { background: #fdeee9; color: var(--accent); font-weight: 600; }

.dm-box {
  background: #fafafa;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 16px;
  font-size: 12.5px;
  color: #444;
  line-height: 1.65;
  display: none;
  margin-top: 10px;
}

.dm-box.open { display: block; }

.dm-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--accent2);
  margin-bottom: 8px;
}

.card-actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: flex-end;
  min-width: 110px;
}

.btn {
  font-family: 'DM Sans', sans-serif;
  font-size: 11px;
  font-weight: 600;
  padding: 8px 14px;
  border-radius: 6px;
  border: 1.5px solid var(--border);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  text-align: center;
  text-decoration: none;
  display: block;
  transition: all 0.15s;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  white-space: nowrap;
  width: 100%;
}

.btn:hover { background: var(--dark); color: #fff; border-color: var(--dark); }
.btn.green { background: var(--accent2); color: #fff; border-color: var(--accent2); }
.btn.green:hover { opacity: 0.85; }
.btn.red-btn { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.copied { background: var(--accent2); color: #fff; border-color: var(--accent2); }

/* STATUS SELECTOR */
.status-select {
  font-family: 'DM Sans', sans-serif;
  font-size: 11px;
  padding: 7px 10px;
  border-radius: 6px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
  width: 100%;
  font-weight: 500;
}

/* CRM PANEL */
.crm-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px;
}

.crm-col-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 18px;
  letter-spacing: 1px;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.crm-count {
  font-family: 'DM Sans', sans-serif;
  font-size: 11px;
  background: var(--tag-bg);
  padding: 2px 8px;
  border-radius: 10px;
  color: var(--muted);
  font-weight: 500;
}

.crm-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 14px 16px;
  margin-bottom: 10px;
}

.crm-card-name {
  font-weight: 600;
  font-size: 14px;
  margin-bottom: 4px;
}

.crm-card-meta {
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 10px;
}

.crm-card-note {
  font-size: 12px;
  color: #555;
  background: var(--tag-bg);
  padding: 8px 10px;
  border-radius: 6px;
  margin-bottom: 10px;
  min-height: 32px;
}

.note-input {
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 7px 10px;
  resize: none;
  color: var(--text);
  background: var(--surface);
  margin-bottom: 8px;
}

.note-input:focus { outline: none; border-color: #aaa; }

.crm-actions { display: flex; gap: 6px; }

/* EMPTY STATE */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
}

.empty-icon { font-size: 40px; margin-bottom: 12px; }
.empty-text { font-size: 13px; }

/* DAILY TARGETS */
.daily-section {
  background: var(--dark);
  border-radius: 10px;
  padding: 24px;
  margin-bottom: 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
}

.daily-text h2 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 28px;
  color: #fff;
  letter-spacing: 1px;
}

.daily-text p {
  font-size: 13px;
  color: #888;
  margin-top: 4px;
}

.daily-progress {
  display: flex;
  align-items: center;
  gap: 12px;
}

.progress-ring {
  position: relative;
  width: 64px;
  height: 64px;
}

.progress-ring svg { transform: rotate(-90deg); }
.progress-ring-text {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 18px;
  color: #fff;
}

.counter-controls { display: flex; gap: 8px; }

.counter-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1.5px solid #333;
  background: transparent;
  color: #fff;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}

.counter-btn:hover { background: var(--accent); border-color: var(--accent); }

/* SEARCH */
.search-bar {
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  padding: 10px 16px;
  border-radius: 8px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--text);
  width: 260px;
  outline: none;
}

.search-bar:focus { border-color: #aaa; }

.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 20px;
}

.results-count {
  font-size: 12px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
</style>
</head>
<body>

<div class="header">
  <div class="logo">MARBIWAZ <span>CRM</span></div>
  <div class="header-stats">
    <div class="hstat"><div class="hstat-num" id="totalLeads">0</div><div class="hstat-label">Leads</div></div>
    <div class="hstat"><div class="hstat-num" id="dmsSent">0</div><div class="hstat-label">DMed</div></div>
    <div class="hstat"><div class="hstat-num" id="inConvo">0</div><div class="hstat-label">Talking</div></div>
    <div class="hstat"><div class="hstat-num" id="closed">0</div><div class="hstat-label">Closed</div></div>
  </div>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('leads')">🎯 Leads</div>
  <div class="tab" onclick="switchTab('crm')">📊 Pipeline</div>
</div>

<!-- LEADS PANEL -->
<div class="panel active" id="panel-leads">

  <div class="daily-section">
    <div class="daily-text">
      <h2>TODAY'S TARGET: 30 DMs</h2>
      <p>Consistency closes clients. Send 30 every day, no days off.</p>
    </div>
    <div class="daily-progress">
      <div class="progress-ring">
        <svg width="64" height="64" viewBox="0 0 64 64">
          <circle cx="32" cy="32" r="26" fill="none" stroke="#222" stroke-width="5"/>
          <circle id="progressCircle" cx="32" cy="32" r="26" fill="none" stroke="#e8400c" stroke-width="5"
            stroke-dasharray="163.4" stroke-dashoffset="163.4" stroke-linecap="round"/>
        </svg>
        <div class="progress-ring-text" id="dmCount">0</div>
      </div>
      <div class="counter-controls">
        <button class="counter-btn" onclick="adjustDM(-1)">−</button>
        <button class="counter-btn" onclick="adjustDM(1)">+</button>
      </div>
    </div>
  </div>

  <div class="top-bar">
    <div class="filters" id="filterBtns">
      <button class="filter-btn active" onclick="filterLeads('all', this)">All</button>
      <button class="filter-btn" onclick="filterLeads('restaurant', this)">🍽 Food & Cafe</button>
      <button class="filter-btn" onclick="filterLeads('clothing', this)">👗 Fashion</button>
      <button class="filter-btn" onclick="filterLeads('clinic', this)">🏥 Clinic</button>
      <button class="filter-btn" onclick="filterLeads('realestate', this)">🏠 Real Estate</button>
      <button class="filter-btn" onclick="filterLeads('education', this)">📚 Education</button>
      <button class="filter-btn" onclick="filterLeads('retail', this)">🛍 Retail</button>
      <button class="filter-btn" onclick="filterLeads('gym', this)">💪 Fitness</button>
      <button class="filter-btn" onclick="filterLeads('events', this)">🎉 Events</button>
    </div>
    <input class="search-bar" id="searchInput" placeholder="Search leads..." oninput="renderLeads()">
  </div>

  <div class="results-count" id="resultsCount" style="margin-bottom:16px"></div>
  <div class="leads-list" id="leadsList"></div>
</div>

<!-- CRM / PIPELINE PANEL -->
<div class="panel" id="panel-crm">
  <div style="margin-bottom:20px; font-size:13px; color:var(--muted)">Leads you've moved to pipeline appear here. Update status from the Leads tab.</div>
  <div class="crm-grid" id="crmGrid"></div>
</div>

<script>
// ─── DATA ───────────────────────────────────────────────────────────────────

const leads = [
  // FOOD & CAFE — mid-size, money to spend
  { id:1, cat:'restaurant', icon:'🍽', name:'Cafe Zouk', area:'DHA Phase 5', budget:'50k–80k/mo',

// ─── STATE ───────────────────────────────────────────────────────────────────

let dmTodayCount = parseInt(localStorage.getItem('dmToday') || '0');
let pipeline = JSON.parse(localStorage.getItem('pipeline') || '[]');
let currentFilter = 'all';

const STATUSES = ['DMed', 'Replied', 'In Convo', 'Proposal Sent', 'Closed', 'Not Interested'];

// ─── INIT ────────────────────────────────────────────────────────────────────

function init() {
  renderLeads();
  updateProgress();
  updateHeaderStats();
}

// ─── TABS ────────────────────────────────────────────────────────────────────

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => {
    t.classList.toggle('active', ['leads','crm'][i] === tab);
  });
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + tab).classList.add('active');
  if (tab === 'crm') renderCRM();
}

// ─── LEADS ───────────────────────────────────────────────────────────────────

function filterLeads(cat, btn) {
  currentFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderLeads();
}

function renderLeads() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  let filtered = leads.filter(l => {
    const matchCat = currentFilter === 'all' || l.cat === currentFilter;
    const matchSearch = !search || l.name.toLowerCase().includes(search) || l.area.toLowerCase().includes(search);
    return matchCat && matchSearch;
  });

  document.getElementById('resultsCount').textContent = `${filtered.length} leads`;
  document.getElementById('totalLeads').textContent = leads.length;

  const list = document.getElementById('leadsList');
  if (!filtered.length) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-text">No leads match your filter</div></div>`;
    return;
  }

  list.innerHTML = filtered.map((l, i) => {
    const inPipeline = pipeline.find(p => p.id === l.id);
    const servicesHTML = l.services.map(s => `<span class="tag service">${s}</span>`).join('');
    return `
    <div class="lead-card" style="animation-delay:${i*0.04}s">
      <div>
        <div class="lead-top">
          <div class="lead-icon">${l.icon}</div>
          <div>
            <div class="lead-name">${l.name}</div>
            <div class="lead-sub">${l.area} · <span style="color:var(--accent);font-weight:600">${l.budget}</span></div>
          </div>
        </div>
        <div class="lead-pain">${l.pain}</div>
        <div class="tags">
          <span class="tag budget">PKR ${l.budget}</span>
          ${servicesHTML}
        </div>
        <div class="dm-box" id="dm-${l.id}">
          <div class="dm-label">📩 DM to send</div>
          ${l.dm}
        </div>
      </div>
      <div class="card-actions">
        <button class="btn" onclick="toggleDM(${l.id})">View DM</button>
        <button class="btn" onclick="copyDM(${l.id}, this)">Copy DM</button>
        ${l.ig ? `<a class="btn" href="https://instagram.com/${l.ig}" target="_blank">Find on IG</a>` : `<a class="btn" href="https://www.instagram.com/explore/search/?q=${encodeURIComponent(l.name+' lahore')}" target="_blank">Search IG</a>`}
        ${inPipeline
          ? `<select class="status-select" onchange="updateStatus(${l.id}, this.value)">${STATUSES.map(s=>`<option ${inPipeline.status===s?'selected':''}>${s}</option>`).join('')}</select>`
          : `<button class="btn green" onclick="addToPipeline(${l.id})">+ Pipeline</button>`
        }
      </div>
    </div>`;
  }).join('');
}

function toggleDM(id) {
  const el = document.getElementById('dm-' + id);
  el.classList.toggle('open');
}

function copyDM(id, btn) {
  const lead = leads.find(l => l.id === id);
  navigator.clipboard.writeText(lead.dm).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy DM'; btn.classList.remove('copied'); }, 2000);
  });
}

// ─── PIPELINE ────────────────────────────────────────────────────────────────

function addToPipeline(id) {
  if (pipeline.find(p => p.id === id)) return;
  const lead = leads.find(l => l.id === id);
  pipeline.push({ id, name: lead.name, area: lead.area, budget: lead.budget, cat: lead.cat, status: 'DMed', note: '', addedAt: new Date().toLocaleDateString() });
  savePipeline();
  renderLeads();
  updateHeaderStats();
}

function updateStatus(id, status) {
  const p = pipeline.find(p => p.id === id);
  if (p) { p.status = status; savePipeline(); updateHeaderStats(); renderCRM(); }
}

function savePipeline() {
  localStorage.setItem('pipeline', JSON.stringify(pipeline));
}

function renderCRM() {
  const grid = document.getElementById('crmGrid');
  if (!pipeline.length) {
    grid.innerHTML = `<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">Add leads to pipeline from the Leads tab</div></div>`;
    return;
  }
  const cols = ['DMed','Replied','In Convo','Proposal Sent','Closed','Not Interested'];
  grid.innerHTML = cols.map(col => {
    const items = pipeline.filter(p => p.status === col);
    const cardsHTML = items.map(p => `
      <div class="crm-card">
        <div class="crm-card-name">${p.name}</div>
        <div class="crm-card-meta">${p.area} · ${p.budget} · Added ${p.addedAt}</div>
        <textarea class="note-input" rows="2" placeholder="Add a note..." onchange="updateNote(${p.id}, this.value)">${p.note || ''}</textarea>
        <div class="crm-actions">
          <select class="status-select" style="flex:1" onchange="updateStatus(${p.id}, this.value)">${STATUSES.map(s=>`<option ${p.status===s?'selected':''}>${s}</option>`).join('')}</select>
          <button class="btn" style="width:auto;padding:7px 10px" onclick="removeFromPipeline(${p.id})">✕</button>
        </div>
      </div>`).join('');
    return `
      <div>
        <div class="crm-col-title">${col} <span class="crm-count">${items.length}</span></div>
        ${cardsHTML || '<div style="font-size:12px;color:var(--muted);padding:8px 0">Empty</div>'}
      </div>`;
  }).join('');
}

function updateNote(id, note) {
  const p = pipeline.find(p => p.id === id);
  if (p) { p.note = note; savePipeline(); }
}

function removeFromPipeline(id) {
  pipeline = pipeline.filter(p => p.id !== id);
  savePipeline();
  renderCRM();
  renderLeads();
  updateHeaderStats();
}

function updateHeaderStats() {
  document.getElementById('dmsSent').textContent = pipeline.filter(p => p.status === 'DMed').length;
  document.getElementById('inConvo').textContent = pipeline.filter(p => ['Replied','In Convo','Proposal Sent'].includes(p.status)).length;
  document.getElementById('closed').textContent = pipeline.filter(p => p.status === 'Closed').length;
}

// ─── DM COUNTER ──────────────────────────────────────────────────────────────

function adjustDM(delta) {
  dmTodayCount = Math.max(0, Math.min(30, dmTodayCount + delta));
  localStorage.setItem('dmToday', dmTodayCount);
  updateProgress();
}

function updateProgress() {
  const pct = dmTodayCount / 30;
  const circ = 163.4;
  document.getElementById('dmCount').textContent = dmTodayCount;
  document.getElementById('progressCircle').style.strokeDashoffset = circ - (circ * pct);
}

init();
</script>
